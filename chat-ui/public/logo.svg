<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background layer: rounded square backdrop -->
  <g id="background">
    <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bgGradient)" />
  </g>

  <!-- Foreground layer: lens/bubble glyph (separable from background) -->
  <g id="glyph">
    <!-- Diagonal tail: drawn first so the ring sits cleanly on top of its base -->
    <path
      d="M 70.4 70.4 L 96 96"
      fill="none"
      stroke="#f5f7ff"
      stroke-width="9"
      stroke-linecap="round"
    />

    <!-- Flattened, rounded tip at the end of the tail -->
    <ellipse
      cx="96"
      cy="96"
      rx="6.5"
      ry="5"
      fill="#f5f7ff"
      transform="rotate(45 96 96)"
    />

    <!-- Lens ring / bubble body: stroke-only, open center -->
    <circle
      cx="52"
      cy="52"
      r="26"
      fill="none"
      stroke="#f5f7ff"
      stroke-width="9"
    />

    <!-- Interior "typing indicator" dots: progressively smaller -->
    <circle cx="41" cy="52" r="4.2" fill="#00d4ff" />
    <circle cx="52.5" cy="52" r="3.2" fill="#00d4ff" />
    <circle cx="62" cy="52" r="2.2" fill="#00d4ff" />
  </g>
</svg>
