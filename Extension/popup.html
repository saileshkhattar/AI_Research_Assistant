<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Research AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700&display=swap"/>
  <link rel="stylesheet" href="popup.css"/>
</head>

<body>
<div class="container">

  <!-- ── HEADER ─────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <div class="logo-dot"></div>
      <span class="app-name">Research AI</span>
    </div>
    <div class="stats-row">
      <div class="stat-pill">
        <span class="stat-val" id="pageCount">0</span>
        <span class="stat-lbl">pages</span>
      </div>
      <div class="stat-pill">
        <span class="stat-val" id="agentCount">0</span>
        <span class="stat-lbl">agents</span>
      </div>
    </div>
  </header>

  <!-- ── AGENT SELECTOR ────────────────── -->
  <section class="section">
    <div class="section-label">Assistant</div>

    <select id="agentSelect" class="select"></select>
    <div id="agentHelper" class="helper-text"></div>

    <div class="row-btns" style="margin-top:10px;">
      <button id="viewUrlsBtn" class="btn btn-ghost">
        <span class="btn-icon">⊞</span> Saved Pages
      </button>
      <button id="createAgentBtn" class="btn btn-outline">
        <span class="btn-icon">+</span> New Agent
      </button>
    </div>
  </section>

  <!-- ── SAVE PAGE ─────────────────────── -->
  <section class="section">
    <div class="section-label">Current Page</div>
    <div id="currentPageUrl" class="current-url">—</div>
    <button id="savePageBtn" class="btn btn-accent full-width" style="margin-top:10px;">
      Save Page to Assistant
    </button>
    <div id="statusMessage" class="status-message"></div>
  </section>

  <!-- ── QUICK ASK ─────────────────────── -->
  <section class="section" style="flex:1;">
    <div class="section-label">Quick Ask</div>
    <textarea
      id="questionBox"
      class="textarea"
      placeholder="Ask something across this assistant's pages…"
    ></textarea>
    <button id="askBtn" class="btn btn-accent full-width" style="margin-top:8px;">
      Open Chat
    </button>
  </section>

</div><!-- /container -->


<!-- ── CREATE AGENT MODAL ────────────── -->
<div id="agentModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">New Agent</span>
      <button id="cancelCreateBtn" class="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <label class="field-label">Agent Name</label>
      <input id="agentNameInput" class="input" placeholder="e.g. Research Assistant" autocomplete="off"/>
      <div id="createError" class="error-text hidden"></div>
    </div>
    <div class="modal-footer">
      <button id="cancelCreateBtn2" class="btn btn-ghost">Cancel</button>
      <button id="confirmCreateBtn" class="btn btn-accent">Create</button>
    </div>
  </div>
</div>


<!-- ── SAVED PAGES MODAL ─────────────── -->
<div id="urlsModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">Saved Pages</span>
      <button id="closeUrlsBtn" class="modal-close">✕</button>
    </div>
    <div id="urlsList" class="urls-list"></div>
  </div>
</div>


<script src="popup.js"></script>
</body>
</html>
